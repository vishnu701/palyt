# Two containers: the Bun gateway and Caddy for TLS.
# Runs on the VM from /opt/kitchenvoice. `deploy.sh` syncs the repo and restarts.
services:
  gateway:
    build:
      context: ../app
      dockerfile: ../deploy/Dockerfile
    image: kitchenvoice-gateway:latest
    restart: unless-stopped
    env_file: /opt/kitchenvoice/.env          # SARVAM_API_KEY, ANTHROPIC_API_KEY, CLAUDE_MODEL
    environment:
      PORT: "3000"
      DATA_DIR: /data
    volumes:
      - /opt/kitchenvoice/data:/data
    expose:
      - "3000"
    # Keep the process hot: no CPU throttling, and a small memory floor.
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"                          # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:443}      # e.g. demo.palyt.in once DNS exists
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway

volumes:
  caddy_data:
  caddy_config:
